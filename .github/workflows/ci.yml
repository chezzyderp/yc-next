name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: branch · commits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install adapter dependencies
        run: npm ci

      - name: Check branch name
        if: github.event_name == 'pull_request'
        run: npm run check:branch -- "${{ github.head_ref }}"

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: npm exec commitlint -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Skip PR-only validation on push
        if: github.event_name != 'pull_request'
        run: echo "No branch/commit validation required on direct main pushes."

  build:
    name: lint · build · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install adapter dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build adapter
        run: npm run build

      - name: Build example app (so e2e tests run)
        working-directory: examples/example-next-app
        run: |
          npm ci
          npm run build

      - name: Build Prisma example
        working-directory: examples/with-database
        run: |
          npm ci
          npm run build

      - name: Test
        run: npm test
