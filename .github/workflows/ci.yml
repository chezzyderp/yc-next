name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · build · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install adapter dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build adapter
        run: npm run build

      - name: Build example app (so e2e tests run)
        working-directory: examples/example-next-app
        run: |
          npm ci
          npm run build

      - name: Test
        run: npm test
